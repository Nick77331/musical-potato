<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Survival Race Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 20px;
        }

        #gameContainer {
            position: relative;
            width: 600px;
            height: 400px;
            margin: 20px auto;
            background-color: #444;
            overflow: hidden;
            border: 2px solid #fff;
        }

        #player {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: #0f0;
            border-radius: 5px;
        }

        #obstacle {
            position: absolute;
            top: 0;
            width: 50px;
            height: 50px;
            background-color: #f00;
            border-radius: 5px;
        }

        #score {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Survival Race</h1>
    <div id="gameContainer">
        <div id="player"></div>
        <div id="obstacle"></div>
    </div>
    <div id="score">Score: 0</div>
    <script>
        const player = document.getElementById('player');
        const obstacle = document.getElementById('obstacle');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');

        let gameInterval;
        let obstacleInterval;
        let score = 0;
        let isGameOver = false;

        let playerPosition = gameContainer.offsetWidth / 2 - 25;

        // Initialize obstacle position
        resetObstacle();

        document.addEventListener('keydown', movePlayer);

        function movePlayer(e) {
            const step = 20;
            if (e.key === 'ArrowLeft') {
                playerPosition = Math.max(0, playerPosition - step);
                player.style.left = playerPosition + 'px';
            } else if (e.key === 'ArrowRight') {
                playerPosition = Math.min(gameContainer.offsetWidth - 50, playerPosition + step);
                player.style.left = playerPosition + 'px';
            }
        }

        function startGame() {
            score = 0;
            isGameOver = false;
            scoreDisplay.innerText = 'Score: 0';
            resetObstacle();

            gameInterval = setInterval(updateGame, 20);
            obstacleInterval = setInterval(resetObstacle, 2000);
        }

        function updateGame() {
            if (isGameOver) return;

            let obstacleY = parseFloat(obstacle.style.top);
            obstacleY += 5; // speed of obstacle
            obstacle.style.top = obstacleY + 'px';

            // Check for collision
            if (
                obstacleY + 50 >= gameContainer.offsetHeight - 50 &&
                parseFloat(obstacle.style.left) < playerPosition + 50 &&
                parseFloat(obstacle.style.left) + 50 > playerPosition
            ) {
                endGame();
            }

            // Increase score when obstacle passes bottom
            if (obstacleY > gameContainer.offsetHeight) {
                score++;
                scoreDisplay.innerText = 'Score: ' + score;
                resetObstacle();
            }
        }

        function resetObstacle() {
            obstacle.style.left = Math.random() * (gameContainer.offsetWidth - 50) + 'px';
            obstacle.style.top = '0px';
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            alert('Game Over! Your score: ' + score);
            isGameOver = true;
        }

        // Start game on load
        window.onload = startGame;
    </script>
</body>
</html>
