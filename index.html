<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Survival Race Multiplayer</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial; }
  canvas { display:block; background:#222; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const players = {}; // store all players
let myId = null;

// handle existing players
socket.on('currentPlayers', (playersData) => {
  for (let id in playersData) {
    players[id] = playersData[id];
  }
  myId = socket.id;
});

// handle new player
socket.on('newPlayer', (playerData) => {
  players[playerData.id] = playerData;
});

// handle player movement
socket.on('playerMoved', (playerData) => {
  if (players[playerData.id]) {
    players[playerData.id] = playerData;
  }
});

// remove disconnected player
socket.on('removePlayer', (id) => {
  delete players[id];
});

// send movement data
function sendPosition(x, y) {
  socket.emit('move', { x, y });
}

// Player controlled variables
const speed = 5;
const keys = {};

window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// game loop
function gameLoop() {
  let myPlayer = players[socket.id];
  if (myPlayer) {
    if (keys['ArrowLeft']) myPlayer.x -= speed;
    if (keys['ArrowRight']) myPlayer.x += speed;
    if (keys['ArrowUp']) myPlayer.y -= speed;
    if (keys['ArrowDown']) myPlayer.y += speed;
    // send position
    sendPosition(myPlayer.x, myPlayer.y);
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let id in players) {
    const p = players[id];
    ctx.fillStyle = id === socket.id ? 'lime' : 'red';
    ctx.fillRect(p.x, p.y, 20, 20);
  }
}

// start game loop
gameLoop();

// resize handler
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
