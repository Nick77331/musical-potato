<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dark Corridors - Horror Survival</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #8b0000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.4);
            border: 2px solid #3a0000;
        }

        canvas {
            display: block;
            background: #0a0a0a;
            cursor: none; /* Hide default cursor to use custom light source */
        }

        /* Scanline effect for retro horror atmosphere */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            pointer-events: none;
        }

        .hud-text {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 4;
            transition: background 0.5s ease;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            text-align: center;
            animation: flicker 3s infinite alternate;
        }

        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        button {
            background: #200;
            color: #ff3333;
            border: 2px solid #8b0000;
            padding: 12px 30px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.2);
        }

        button:hover {
            background: #8b0000;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; text-shadow: 0 0 10px #8b0000; }
            20%, 24%, 55% { opacity: 0.3; text-shadow: none; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div id="score-display" class="hud-text">FRAGMENTS COLLECTED: 0</div>
            <div id="stamina-display" class="hud-text">STAMINA: 100%</div>
        </div>

        <div id="screen-overlay">
            <h1 id="menu-title">THE DARK CORRIDORS</h1>
            <p id="menu-instructions">
                Use <b>WASD</b> or <b>Arrow Keys</b> to move.<br>
                Hold <b>SHIFT</b> to sprint.<br>
                Use your <b>Mouse</b> to aim your flashlight.<br><br>
                Collect the glowing red fragments.<br>
                Do not let the things in the dark touch you.
            </p>
            <button id="start-btn">ENTER THE DARKNESS</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const screenOverlay = document.getElementById('screen-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuInstructions = document.getElementById('menu-instructions');
        const scoreDisplay = document.getElementById('score-display');
        const staminaDisplay = document.getElementById('stamina-display');

        // Game Configuration & State
        let gameActive = false;
        let score = 0;
        let keysPressed = {};
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        // Player Setup
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            baseSpeed: 2.5,
            sprintSpeed: 4.5,
            stamina: 100,
            maxStamina: 100,
            color: '#dedede'
        };

        // Entities Lists
        let enemies = [];
        let items = [];
        let enemySpawnTimer = 0;
        const enemySpawnInterval = 160; // Frames between spawns

        // Event Listeners
        window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            // Reset entities and stats
            enemies = [];
            items = [];
            score = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.stamina = player.maxStamina;
            scoreDisplay.textContent = `FRAGMENTS COLLECTED: ${score}`;
            
            // Spawn initial items
            for (let i = 0; i < 5; i++) spawnItem();

            screenOverlay.style.display = 'none';
            gameActive = true;
        }

        function triggerGameOver() {
            gameActive = false;
            screenOverlay.style.display = 'flex';
            screenOverlay.style.background = 'rgba(25, 0, 0, 0.95)';
            menuTitle.textContent = "YOU DIED";
            menuTitle.style.color = "#ff0000";
            menuInstructions.innerHTML = `The dark claimed you.<br><br><b>Final Score: ${score} fragments collected.</b>`;
            startBtn.textContent = "TRY AGAIN";
        }

        function spawnItem() {
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                radius: 6,
                pulse: 0
            });
        }

        function spawnEnemy() {
            // Spawn enemies just off-screen boundaries safely
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }

            enemies.push({
                x: x,
                y: y,
                radius: 14,
                speed: Math.random() * 1.2 + 1.0,
                color: 'rgba(30, 0, 0, 0.8)' // Shrouded visual style
            });
        }

        // Main game mechanics loop
        function update() {
            if (!gameActive) return;

            // 1. Movement Calculations & Stamina Mechanics
            let currentSpeed = player.baseSpeed;
            if (keysPressed['shift'] && player.stamina > 5 && (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d'] || keysPressed['arrowup'] || keysPressed['arrowleft'] || keysPressed['arrowdown'] || keysPressed['arrowright'])) {
                currentSpeed = player.sprintSpeed;
                player.stamina = Math.max(0, player.stamina - 0.6);
            } else {
                player.stamina = Math.min(player.maxStamina, player.stamina + 0.25);
            }
            staminaDisplay.textContent = `STAMINA: ${Math.floor(player.stamina)}%`;

            if (keysPressed['w'] || keysPressed['arrowup']) player.y -= currentSpeed;
            if (keysPressed['s'] || keysPressed['arrowdown']) player.y += currentSpeed;
            if (keysPressed['a'] || keysPressed['arrowleft']) player.x -= currentSpeed;
            if (keysPressed['d'] || keysPressed['arrowright']) player.x += currentSpeed;

            // Keep player bounded within canvas
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // 2. Enemy Spawning Logic
            enemySpawnTimer++;
            if (enemySpawnTimer >= enemySpawnInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            // 3. Enemy Track Engine & Collision Checks
            enemies.forEach((enemy) => {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.hypot(dx, dy);

                // Move closer toward player position coordinates
                enemy.x += (dx / dist) * enemy.speed;
                enemy.y += (dy / dist) * enemy.speed;

                // Player damage collision detection trigger
                if (dist < player.radius + enemy.radius) {
